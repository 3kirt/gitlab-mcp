name: Release

# verify → checks (all of ci.yml) → build + smoke each artifact → publish.
# A release can't ship untested, mismatched, off-main, or without notes.
# Shared shape with netbox-mcp and proxmox-mcp.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: gitlab-mcp

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The Claude Code plugin's bootstrap downloads the release binary
      # matching plugin.json's version; a version that lags the tag would
      # silently serve plugin users the previous release's binary.
      - name: Versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          plugin_version="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          echo "tag=$tag cargo=$cargo_version plugin=$plugin_version"
          test "$cargo_version" = "$tag" || { echo "Cargo.toml version does not match tag"; exit 1; }
          test "$plugin_version" = "$tag" || { echo "plugin.json version does not match tag"; exit 1; }

      - name: Tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: CHANGELOG has a section for this version
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME"

  checks:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.artifact }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc floor at 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: gitlab-mcp-linux-amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: gitlab-mcp-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: gitlab-mcp-darwin-arm64
          # Cross-built on Apple Silicon; smoke-tested under Rosetta.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: gitlab-mcp-darwin-amd64
            rosetta: true
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain + target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        run: cp target/${{ matrix.target }}/release/$BIN ${{ matrix.artifact }}

      - name: Install Rosetta
        if: matrix.rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      # Execute the exact file that will be published. (With Rosetta
      # installed, macOS runs the x86_64 binary translated automatically.)
      - name: Smoke test
        env:
          SMOKE_VERSION: ${{ github.ref_name }}
        run: make smoke BIN=${{ matrix.artifact }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum * > checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/${{ env.BIN }}-*

      - name: Release notes from CHANGELOG
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME" > release-notes.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
