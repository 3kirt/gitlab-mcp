name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --all --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Mirrors `make lint`: all targets (tests included) under both feature
      # sets, so test code and the live suite are linted too.
      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo clippy --all-targets --features live-tests --locked -- -D warnings

      - run: cargo fmt --check

      # .mcp.json is tracked (with ${VAR} placeholders); make sure no real
      # GitLab token ever lands in the repo. Docs use the all-x placeholder
      # glpat-xxxxxxxxxxxxxxxxxxxx, which no real (random) token resembles.
      - name: Scan for committed GitLab tokens
        run: |
          if git grep -nE 'glpat-[A-Za-z0-9_-]{10,}' -- . | grep -vE 'glpat-x{10,}'; then
            echo "A GitLab personal access token appears to be committed"; exit 1
          fi

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails on any RustSec vulnerability advisory against Cargo.lock.
      - run: cargo audit
